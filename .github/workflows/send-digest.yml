name: Send digest

# Istanbul = UTC+3 year-round (Türkiye no longer observes DST).
# 09:00 Istanbul = 06:00 UTC; 18:00 Istanbul = 15:00 UTC.
on:
  schedule:
    - cron: "0 6 * * *" # 09:00 Istanbul
    - cron: "0 15 * * *" # 18:00 Istanbul
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger digest endpoint
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing DEPLOY_URL or CRON_SECRET secret"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DEPLOY_URL/api/cron/digest")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Digest failed with status $status"
            exit 1
          fi
