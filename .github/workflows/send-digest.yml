name: Send digest

# Karlsruhe (Europe/Berlin): 07:00 UTC = 08:00 in winter / 09:00 in summer;
# 17:00 UTC = 18:00 in winter / 19:00 in summer.
on:
  schedule:
    - cron: "0 7 * * *" # morning, Karlsruhe
    - cron: "0 17 * * *" # evening, Karlsruhe
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger digest endpoint
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing DEPLOY_URL or CRON_SECRET secret"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DEPLOY_URL/api/cron/digest")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Digest failed with status $status"
            exit 1
          fi
